services:
  gitpulse:
    build: .
    container_name: gitpulse-app
    ports:
      - "8000:8000"
    volumes:
      - ./repositories:/app/repositories:ro
      - ./data:/app/data
    environment:
      # The machine's one Ollama on the host. docker-ollama.yml (the optional
      # container, OLLAMA_RUNTIME=container) points this at its ollama service.
      - OLLAMA_HOST=${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      # Empty: the image's ai-models.env decides. Set OLLAMA_MODEL in .env to override.
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - DATABASE_URL=sqlite:///data/gitpulse.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
